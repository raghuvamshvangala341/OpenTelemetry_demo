# AgentQA manifest (design §3.2). Generated by `agentqa init`.
# trustMode starts at `observe` (no writes to this repo); switch to
# `suggest` once the first observe run looks right. Credentials are
# refs only (env:VAR / vault:path) — never literal secrets.
repo:
  url: https://github.com/raghuvamshvangala341/OpenTelemetry_demo
  defaultBranch: main
  caseDir: tests/cases
stack: playwright-ts
environments:
  staging:
    baseUrl: http://host.docker.internal:3000
    credentials:
      username: env:QZTESTING_AGENTQA_USERNAME
      password: env:QZTESTING_AGENTQA_PASSWORD
policies:
  trustMode: observe
connectors: {}
